services:
  - type: web
    name: los-compas-pizzeria
    env: node
    plan: free
    buildCommand: bash scripts/render-build.sh
    startCommand: npx next start -p $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: los-compas-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
